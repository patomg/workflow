<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Fotos: poner foto-fade.jpg, foto-clasico.jpg y foto-barba.jpg en esta carpeta. Si falta una, se ve el recuadro de relleno. */
h1 { font-size: 84px; margin-top: 20px; }
.rule { margin: 26px auto 36px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 400px 340px; gap: 22px; }
.photo { position: relative; border-radius: 16px; overflow: hidden; border: 2px solid #c9a24a;
  background: repeating-linear-gradient(135deg, #241e17 0 22px, #1c1813 22px 44px); }
.photo .img { position: absolute; inset: 0; background-size: cover; background-position: center; }
.photo.big { grid-column: 1 / 3; }
.photo .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: 'Oswald'; font-size: 36px; letter-spacing: 6px; color: rgba(201,162,74,.45); }
.photo .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 26px 20px;
  background: linear-gradient(to top, rgba(22,19,15,.95), rgba(22,19,15,0)); }
.photo .label b { display: block; font-family: 'Oswald'; font-weight: 600; font-size: 44px; text-transform: uppercase; letter-spacing: 1px; }
.photo .label span { font-size: 26px; color: #c9a24a; font-weight: 600; }
.foot .cta { font-size: 40px; }
</style></head>
<body><div class="card">
  <div class="brand"><div class="pole"></div><span>BARBERÍA</span><div class="pole"></div></div>
  <h1>Nuestros cortes</h1>
  <div class="rule"><i></i></div>

  <div class="grid">
    <div class="photo big"><div class="ph">FOTO FADE</div><div class="img" style="background-image:url('foto-fade.jpg')"></div>
      <div class="label"><b>Degradado (fade)</b><span>$12.000</span></div></div>
    <div class="photo"><div class="ph">FOTO CLÁSICO</div><div class="img" style="background-image:url('foto-clasico.jpg')"></div>
      <div class="label"><b>Corte clásico</b><span>$10.000</span></div></div>
    <div class="photo"><div class="ph">FOTO BARBA</div><div class="img" style="background-image:url('foto-barba.jpg')"></div>
      <div class="label"><b>Barba</b><span>$6.000</span></div></div>
  </div>

  <div class="foot">
    <div class="cta">Agenda tu hora por este chat</div>
    <div class="small">También: corte niños · tinte · diseño de cejas</div>
  </div>
</div></body></html>
